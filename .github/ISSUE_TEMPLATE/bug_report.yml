name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't use this
        template for security vulnerabilities — see [SECURITY.md](https://github.com/nikhilvdev/logquill-js/blob/main/.github/SECURITY.md)
        instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short code snippet that reproduces the issue.
      render: typescript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: logquill version
      placeholder: e.g. 0.1.2
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 22.4.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or stack trace
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been reported already
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
