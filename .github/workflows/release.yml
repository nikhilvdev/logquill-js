name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/logquill
    permissions:
      id-token: write # mandatory for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check if package.json version is unpublished
        id: version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view logquill version 2>/dev/null || echo "none")
          echo "local package.json version: $LOCAL_VERSION"
          echo "latest published version:   $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.should_publish == 'true'
        run: npm ci
      - if: steps.version.outputs.should_publish == 'true'
        run: npm install -g npm@latest # ensure >=11.5.1 for OIDC support
      - if: steps.version.outputs.should_publish == 'true'
        run: npm run lint
      - if: steps.version.outputs.should_publish == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.should_publish == 'true'
        run: npm test
      - if: steps.version.outputs.should_publish == 'true'
        run: npm run build
      - if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public
