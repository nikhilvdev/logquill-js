name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/logquill
    permissions:
      id-token: write # mandatory for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "tag version:          $TAG_VERSION"
          echo "package.json version: $LOCAL_VERSION"
          if [ "$TAG_VERSION" != "$LOCAL_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $LOCAL_VERSION — refusing to publish."
            exit 1
          fi

      - run: npm ci
      - run: npm install -g npm@latest # ensure >=11.5.1 for OIDC support
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
